<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ميثاق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f6;--surface:#fff;--surface-2:#eef1f3;--line:#dbe2e6;--ink:#12212b;--ink-2:#4b5d69;--ink-3:#6f828d;--accent:#0b7564;--accent-soft:#dff0eb;--accent-ink:#fff;--band:#12212b;--band-ink:#c3d1d9;--band-strong:#fff;--band-line:#26404f;--ok:#2d7a4c;--ok-soft:#e2f1e7;--mid:#8f6500;--mid-soft:#fbf0d2;--hi:#b83232;--hi-soft:#f8e3e3;--info:#2f5f8f;--info-soft:#e4edf6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d161c;--surface:#132028;--surface-2:#1a2a33;--line:#243741;--ink:#e3eaee;--ink-2:#a3b3bc;--ink-3:#7f919b;--accent:#3cb49f;--accent-soft:#10302a;--accent-ink:#06201b;--band:#0a1216;--band-ink:#a9bac3;--band-line:#1d2e37;--ok:#5fbf86;--ok-soft:#12301f;--mid:#e0b441;--mid-soft:#33290d;--hi:#e57373;--hi-soft:#3a1818;--info:#79a7d6;--info-soft:#152636}}
:root[data-theme="dark"]{--bg:#0d161c;--surface:#132028;--surface-2:#1a2a33;--line:#243741;--ink:#e3eaee;--ink-2:#a3b3bc;--ink-3:#7f919b;--accent:#3cb49f;--accent-soft:#10302a;--accent-ink:#06201b;--band:#0a1216;--band-ink:#a9bac3;--band-line:#1d2e37;--ok:#5fbf86;--ok-soft:#12301f;--mid:#e0b441;--mid-soft:#33290d;--hi:#e57373;--hi-soft:#3a1818;--info:#79a7d6;--info-soft:#152636}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.band{background:var(--band);color:var(--band-ink)}
.band-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 0 12px}
.brand{display:flex;align-items:center;gap:12px;margin-inline-end:auto}
.brand-mark{width:56px;height:56px;flex:none}
.brand h1{margin:0;font-size:20px;font-weight:700;font-family:'Cairo','IBM Plex Sans Arabic',sans-serif;color:var(--band-strong);line-height:1.2}
.brand p{margin:0;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--band-line);border-radius:999px;padding:3px 11px;font-size:12.5px;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--band-ink)}
.pill.on .dot{background:#4fd1b5}.pill.off .dot{background:#e0b441}
.pill.demo{border-color:#8f6c14;color:#f1cf73}
.iconbtn{background:none;border:1px solid var(--band-line);color:var(--band-ink);border-radius:8px;width:32px;height:32px;display:inline-grid;place-items:center;cursor:pointer}
.iconbtn:hover{color:var(--band-strong)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--band-ink);padding:10px 14px 12px;cursor:pointer;white-space:nowrap;font-size:14.5px}
nav.tabs button:hover{color:var(--band-strong)}
nav.tabs button[aria-selected="true"]{color:var(--band-strong);border-bottom-color:#4fd1b5;font-weight:500}
main{padding:26px 0 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h2{margin:0;font-size:22px;font-weight:600;line-height:1.35}
.head p{margin:4px 0 0;color:var(--ink-2);max-width:70ch}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.g-2b{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:900px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.g-2,.g-2b{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:15.5px;font-weight:600}
.card-h .sub{font-size:12.5px;color:var(--ink-3)}
.card-b{padding:16px 18px}
.kpi{padding:16px 18px}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi .v{font-size:33px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .n{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:16px;height:16px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 9px;font-size:12.5px;font-weight:500;white-space:nowrap}
.s-met{background:var(--ok-soft);color:var(--ok)}.s-partial{background:var(--mid-soft);color:var(--mid)}.s-gap{background:var(--hi-soft);color:var(--hi)}.s-review{background:var(--info-soft);color:var(--info)}.s-na{background:var(--surface-2);color:var(--ink-3)}
.l-low{background:var(--ok-soft);color:var(--ok)}.l-medium{background:var(--mid-soft);color:var(--mid)}.l-high{background:var(--hi-soft);color:var(--hi)}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.code{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}.small{font-size:13px}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 40px 88px;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer}
.vrow:first-child{border-top:0}
.vrow:hover{background:var(--surface-2)}
.vrow .nm{font-weight:500}
.bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;width:0;border-radius:4px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.hm-wrap{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;direction:ltr}
.hm-y{display:flex;flex-direction:column;justify-content:space-between;padding:8px 0 26px;font-size:12px;color:var(--ink-3)}
.hm{position:relative;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);aspect-ratio:1.45;gap:3px;direction:ltr}
.hm .cell{border-radius:5px}
.hm .c-low{background:var(--ok-soft)}.hm .c-medium{background:var(--mid-soft)}.hm .c-high{background:var(--hi-soft)}
.hm-dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;border:2px solid var(--surface);cursor:pointer;transition:left 1.1s cubic-bezier(.2,.8,.2,1),top 1.1s cubic-bezier(.2,.8,.2,1),opacity .4s}
.hm-x{display:flex;justify-content:space-between;direction:ltr;font-size:12px;color:var(--ink-3);padding:4px 2px 0}
.ins{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:10px;align-items:center;padding:8px 0}
.net text{font-family:inherit}
table{border-collapse:collapse;width:100%}
th,td{text-align:start;padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;background:var(--surface-2);font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tscroll{overflow-x:auto}
.quote{border-inline-start:3px solid var(--line);padding-inline-start:10px;margin:6px 0 2px;color:var(--ink-2);font-size:13.5px}
.vq{font-size:12px;color:var(--ok);display:inline-flex;align-items:center;gap:4px}
.uq{font-size:12px;color:var(--info)}
.steps{display:grid;gap:8px}
.step{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:14px}
.step .ic{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.step.run{color:var(--ink)}.step.run .ic{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.step.done{color:var(--ink)}.step.done .ic{border-color:var(--ok);background:var(--ok);color:#fff}
.step.skip{color:var(--ink-3)}.step.skip .ic{border-color:var(--mid)}
@keyframes spin{to{transform:rotate(360deg)}}
.doc{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.doc[data-mode="cited"] .sent:not(.hit){display:none}
.doc[data-mode="none"] .sent{display:none}
.doc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.doc-head h4{margin:0;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.doc-toggle{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.doc-toggle:hover{background:var(--surface-2);color:var(--ink)}
.upchip{display:none;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-top:6px;background:var(--surface-2)}
.upchip-icon{font-size:16px}
.upchip-name{font-weight:500;font-size:13.5px}
.upchip-meta{font-size:12.5px;color:var(--ink-3)}
.upchip button{margin-inline-start:auto}
.sent{display:flex;align-items:flex-start;gap:10px;padding:8px 6px;font-size:14px;line-height:1.75;border-top:1px solid var(--line)}
.sent:first-child{border-top:0}
.sent .sid{flex:none;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--surface-2);color:var(--ink-3);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.sent.hit{background:var(--accent-soft)}
.sent.hit .sid{background:var(--accent);color:var(--accent-ink)}
.sent.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{background:var(--mid-soft)}100%{background:var(--accent-soft)}}
textarea{width:100%;min-height:170px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);line-height:1.8;font-size:14px}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.err{font-size:13.5px;color:var(--hi);background:var(--hi-soft);border-radius:8px;padding:10px 12px}
.prof{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.prof div{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.formula{font-size:13.5px;display:grid;gap:6px}
.formula .row{display:flex;justify-content:space-between;gap:10px}
.eval{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.eval .box{background:var(--surface-2);border-radius:10px;padding:12px}
.eval .box .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.vcard{padding:16px 18px;cursor:pointer;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.vcard:hover{border-color:var(--accent)}
.hidden{display:none!important}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.field{display:block;margin-top:14px}
.uprow{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.field>span{display:block;font-size:13.5px;font-weight:500;margin-bottom:6px}
input[type=text]{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--surface)}
input[type=text]:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.ferr{font-size:13px;color:var(--hi);margin-top:5px;min-height:0}
.q{border:0;padding:10px 0;margin:0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.q legend{float:right;font-size:13.5px;padding:0;max-width:60%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:5px 14px;font-size:13.5px}
.seg label+label span{border-inline-start:1px solid var(--line)}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);font-weight:500}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.sticky{position:sticky;top:12px}
.aprow{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.aprow:first-child{border-top:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="band">
  <div class="wrap">
    <div class="band-top">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true" fill="none">
          <defs>
            <linearGradient id="logoGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f6dfa0"/><stop offset="30%" stop-color="#d8a94a"/><stop offset="55%" stop-color="#b9822f"/><stop offset="78%" stop-color="#e6c777"/><stop offset="100%" stop-color="#a8762a"/></linearGradient>
            <linearGradient id="logoGoldSoft" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e9c877"/><stop offset="100%" stop-color="#b1832f"/></linearGradient>
            <radialGradient id="logoGreenGlow" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#2fae7d"/><stop offset="100%" stop-color="#0e5a3c"/></radialGradient>
          </defs>
          <circle cx="50" cy="50" r="48" fill="none" stroke="url(#logoGold)" stroke-width="3.3"/>
          <circle cx="50" cy="50" r="42" fill="none" stroke="url(#logoGoldSoft)" stroke-width="1"/>
          <circle cx="50" cy="50" r="36" fill="url(#logoGreenGlow)"/>
          <circle cx="50" cy="50" r="36" fill="none" stroke="url(#logoGold)" stroke-width="1.3"/>
          <g transform="translate(50,50)">
            <path d="M0 -37 L29 -24 V6 C29 28 16 42 0 49 C-16 42 -29 28 -29 6 V-24 Z" fill="none" stroke="#f3e3b0" stroke-width="4.2" stroke-linejoin="round"/>
            <path d="M-14 2 L-4 14 L17 -11" fill="none" stroke="#f3e3b0" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
        <div>
          <h1>ميثاق</h1>
          <p>تقييم مخاطر الموردين وفق الضوابط الأساسية للأمن السيبراني ECC-2:2024 ونظام حماية البيانات الشخصية PDPL</p>
        </div>
      </div>
      <span class="pill demo" title="الموردون ووثائقهم بيانات تجريبية للعرض">بيانات تجريبية</span>
      <span class="pill off" id="aiPill"><span class="dot"></span><span id="aiPillText">جارٍ التحقق من الذكاء الاصطناعي</span></span>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="تبديل الوضع الداكن">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      </button>
    </div>
    <nav class="tabs" role="tablist" aria-label="أقسام المنصة">
      <button role="tab" data-view="dashboard" aria-selected="true">لوحة المخاطر</button>
      <button role="tab" data-view="vendors" aria-selected="false">الموردون</button>
      <button role="tab" data-view="lab" aria-selected="false">المختبر الحي</button>
      <button role="tab" data-view="library" aria-selected="false">الضوابط والأطر</button>
    </nav>
  </div>
</div>
<main class="wrap" id="main" tabindex="-1"></main>
<script>
"use strict";
/* ============ Regulatory library (ECC-2:2024, domain 4) ============
   Summaries are the team's own Arabic wording; the binding text is the official NCA document. */
const ECC_SOURCE = {
  label: "الضوابط الأساسية للأمن السيبراني (ECC-2:2024) — المكوّن الأساسي 4",
  url: "https://nca.gov.sa/en/regulatory-documents/controls-list/ecc/"
};
const ISO = {
  "5.12": "تصنيف المعلومات",
  "5.19": "أمن المعلومات في العلاقات مع الموردين",
  "5.20": "معالجة أمن المعلومات ضمن اتفاقيات الموردين",
  "5.21": "إدارة أمن المعلومات في سلسلة إمداد التقنية والاتصالات",
  "5.22": "مراقبة خدمات الموردين ومراجعتها وإدارة تغييراتها",
  "5.23": "أمن المعلومات عند استخدام الخدمات السحابية",
  "5.24": "التخطيط والاستعداد لإدارة حوادث أمن المعلومات",
  "6.6": "اتفاقيات السرية أو عدم الإفصاح",
  "8.10": "حذف المعلومات",
  "27701-8.2": "ISO/IEC 27701:2019 — البند 8.2: شروط جمع البيانات الشخصية ومعالجتها (يشمل المعالجة وفق تعليمات موثقة)، ضمن ضوابط الملحق B لجهة المعالجة",
  "27701-8.5": "ISO/IEC 27701:2019 — البند 8.5: مشاركة البيانات الشخصية ونقلها والإفصاح عنها، بما يشمل إدارة معالج من الباطن ونقلها خارج الجهة",
  "27701-8.4": "ISO/IEC 27701:2019 — البند 8.4: الخصوصية حسب التصميم والمبدأ الافتراضي، بما يشمل إعادة البيانات الشخصية أو إتلافها",
  "27701-B": "ISO/IEC 27701:2019 — الملحق B: ضوابط جهة المعالجة عمومًا (يشمل الإبلاغ عن الحوادث ضمن التزاماتها تجاه الجهة المتحكمة، دون بند مستقل مرقّم لهذا العنصر تحديدًا)",
  "27701-6.3.1.1": "ISO/IEC 27701:2019 — البند 6.3.1.1: تعيين جهة اتصال يمكن الرجوع إليها بخصوص معالجة البيانات الشخصية"
};
const NIST = {
  "GV.SC-05": "تضمين متطلبات الأمن السيبراني في العقود والاتفاقيات مع الموردين",
  "GV.SC-06": "التخطيط والعناية الواجبة قبل الدخول في علاقة مع المورد",
  "GV.SC-07": "فهم مخاطر المورد وتقييمها ومتابعتها طوال العلاقة",
  "GV.SC-08": "إشراك الموردين في التخطيط للحوادث والاستجابة والتعافي",

function networkSVG() {
  const W = 600, H = 390, cx = 300, cy = 195;
  const vs = VENDORS.map((v, i) => { const ang = -Math.PI / 2 + i * 2 * Math.PI / VENDORS.length; return { id: v.id, v, x: cx + 165 * Math.cos(ang), y: cy + 112 * Math.sin(ang), ang }; });
  const byName = n => vs.find(x => norm(x.v.name).includes(norm(n)) || norm(n).includes(norm(x.v.name)));
  const parties = []; const edges = []; const inbound = {};
  for (const x of vs) for (const f of state.analyses[x.id].fourth) {
    const target = byName(f.name);
    if (target && target.id === x.id) continue;
    let key;
    if (target) key = "v:" + target.id;
    else { let p = parties.find(p => norm(p.name) === norm(f.name)); if (!p) { const ang = x.ang + (parties.length % 2 ? 0.35 : -0.35); p = { name: f.name, x: cx + 262 * Math.cos(ang), y: cy + 168 * Math.sin(ang) }; p.x = Math.max(70, Math.min(W - 70, p.x)); p.y = Math.max(22, Math.min(H - 22, p.y)); parties.push(p); } key = "p:" + p.name; }
    edges.push({ from: x, key }); inbound[key] = (inbound[key] || 0) + 1;
  }
  const pos = key => key.startsWith("v:") ? vs.find(x => "v:" + x.id === key) : parties.find(p => "p:" + p.name === key);
  const conc = Object.entries(inbound).filter(([, n]) => n >= 2);
  let s = `<svg class="net" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="شبكة اعتماد الموردين على أطراف رابعة">`;
  for (const x of vs) s += `<line x1="${cx}" y1="${cy}" x2="${x.x}" y2="${x.y}" stroke="var(--line)" stroke-width="2"/>`;
  for (const e of edges) { const t = pos(e.key); const hot = inbound[e.key] >= 2; s += `<line x1="${e.from.x}" y1="${e.from.y}" x2="${t.x}" y2="${t.y}" stroke="${hot ? "var(--hi)" : "var(--ink-3)"}" stroke-width="${hot ? 2 : 1.4}" stroke-dasharray="5 4"/>`; }
  s += `<circle cx="${cx}" cy="${cy}" r="30" fill="var(--accent)"/><text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="14" font-weight="600" fill="var(--accent-ink)">الجهة</text>`;
  for (const x of vs) {
    const a = state.analyses[x.id]; const hot = inbound["v:" + x.id] >= 2;
    s += `<g style="cursor:pointer" data-act="vendor" data-id="${x.id}">${hot ? `<circle cx="${x.x}" cy="${x.y}" r="26" fill="none" stroke="var(--hi)" stroke-width="2"/>` : ""}
      <circle cx="${x.x}" cy="${x.y}" r="20" fill="${LEVEL_COLOR[a.score.level]}"/><text x="${x.x}" y="${x.y + 5}" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">${esc(x.v.short)}</text>
      <text x="${x.x}" y="${x.y < cy ? x.y - 32 : x.y + 42}" text-anchor="middle" font-size="12.5" fill="var(--ink)" paint-order="stroke" stroke="var(--surface)" stroke-width="4">${esc(x.v.name)}</text></g>`;
  }
  for (const p of parties) { const hot = inbound["p:" + p.name] >= 2; s += `<rect x="${p.x - 62}" y="${p.y - 14}" width="124" height="28" rx="14" fill="var(--surface-2)" stroke="${hot ? "var(--hi)" : "var(--line)"}"/><text x="${p.x}" y="${p.y + 5}" text-anchor="middle" font-size="12" fill="var(--ink-2)">${esc(p.name)}</text>`; }
  s += `</svg>`;
  const legend = conc.length ? conc.map(([k, n]) => { const t = pos(k); const nm = k.startsWith("v:") ? t.v.name : t.name; return `<p class="note" style="margin:10px 0 0"><strong style="color:var(--hi)">خطر تركّز:</strong> يعتمد ${vendorsAr(n)} من مورديك على «${esc(nm)}». تعطّله أو اختراقه يؤثر على أكثر من خدمة في الوقت نفسه.</p>`; }).join("")
    : `<p class="small faint" style="margin:8px 0 0">لا يوجد طرف رابع يعتمد عليه أكثر من مورد.</p>`;
  return s + legend;
}

const PDFJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const MAMMOTH_URL = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.12.3/mammoth.browser.min.js";
const _loadedScripts = {};
function loadScriptOnce(url) {
  if (_loadedScripts[url]) return _loadedScripts[url];
  _loadedScripts[url] = new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = url; el.onload = () => resolve(); el.onerror = () => reject(new Error("تعذّر تحميل مكتبة القراءة من الشبكة."));
    document.head.appendChild(el);
  });
  return _loadedScripts[url];
}
async function ensurePdfJs() {
  if (!window.pdfjsLib) await loadScriptOnce(PDFJS_BASE + "pdf.min.js");
  if (!window.pdfjsLib) throw new Error("تعذّر تحميل مكتبة قراءة PDF.");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.js";
  return window.pdfjsLib;
}
async function ensureMammoth() {
  if (!window.mammoth) await loadScriptOnce(MAMMOTH_URL);
  if (!window.mammoth) throw new Error("تعذّر تحميل مكتبة قراءة Word.");
  return window.mammoth;
}
/* PDF text is stored per glyph-run with only a position, not a reading order — this rebuilds
   right-to-left lines from those positions instead of the left-to-right order pdf.js exposes. */
async function extractPdfText(buf) {
  const pdfjsLib = await ensurePdfJs();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    const items = tc.items.map(it => ({ str: it.str, x: it.transform[4], y: Math.round(it.transform[5]), w: it.width || 0 }));
    if (!items.length) continue;
    const lines = {};
    for (const it of items) {
      let key = null;
      for (const k of Object.keys(lines)) { if (Math.abs(Number(k) - it.y) <= 2) { key = k; break; } }
      if (key === null) key = it.y;
      (lines[key] = lines[key] || []).push(it);
    }
    const ys = Object.keys(lines).map(Number).sort((a, b) => b - a);
    const pageLines = ys.map(y => {
      const row = lines[y].slice().sort((a, b) => b.x - a.x);
      let s = "", prevReal = null;
      for (const it of row) {
        const text = it.str.replace(/[\u064B-\u0652]/g, ""); // diacritics: norm() strips them anyway; keeping them only misplaces spaces
        if (!text) continue;
        if (s && prevReal) {
          const gap = prevReal.x - (it.x + it.w);
          if (gap > 40) s += "   "; else if (gap > 2.2 && !/\s$/.test(s)) s += " ";
        }
        s += text; prevReal = it;
      }
      return s;
    });
    pages.push(pageLines.filter(l => l.trim()).join("\n"));
  }
  let joined = pages.join("\n\n").normalize("NFKC");
  for (let pass = 0; pass < 2; pass++) joined = joined.replace(/([\u0600-\u06FF])[ \t]([\u0600-\u06FF])(?=[ \t\n.,،؛:)\]]|$)/gu, "$1$2");
  return joined.trim();
}
async function extractDocxText(buf) {
  const mammoth = await ensureMammoth();
  const res = await mammoth.extractRawText({ arrayBuffer: buf });
  return res.value.normalize("NFKC").trim();
}
async function extractFileText(file) {
  const name = (file.name || "").toLowerCase();
  if (file.size > 20 * 1024 * 1024) throw new Error("الملف أكبر من الحد المسموح (20 ميغابايت).");
  if (/\.(txt|md)$/.test(name) || /^text\//.test(file.type)) return (await file.text()).normalize("NFKC").trim();
  if (/\.pdf$/.test(name) || file.type === "application/pdf") {
    const text = await extractPdfText(await file.arrayBuffer());
    if (text.replace(/\s/g, "").length < 20) throw new Error("لم يُعثر على نص في هذا الملف. قد يكون مستندًا ممسوحًا ضوئيًا (صورة) دون طبقة نص قابلة للاستخراج؛ الصق النص يدويًا في هذه الحالة.");

/* ---------- Direct AI-provider API fallback (used only when the page runs OUTSIDE the artifact
   environment that supplies window.claude, e.g. hosted on GitHub Pages).
   The API key is entered by whoever uses the browser and is kept only in that browser's

const DIRECT_KEY_STORE = "radar.aiApiKey";
const DIRECT_MODEL = "claude-sonnet-5";
function getApiKey() { try { return localStorage.getItem(DIRECT_KEY_STORE) || ""; } catch { return ""; } }
function setApiKey(k) { try { if (k) localStorage.setItem(DIRECT_KEY_STORE, k); else localStorage.removeItem(DIRECT_KEY_STORE); } catch { /* ignore */ } }

async function anthropicComplete(prompt, opts = {}) {
  const key = getApiKey();
  if (!key) { const e = new Error("no api key"); e.code = "not_granted"; throw e; }
  if (prompt.length > 600000) { const e = new Error("prompt too large"); e.code = "prompt_too_large"; throw e; }
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: DIRECT_MODEL, max_tokens: 4096, messages: [{ role: "user", content: prompt }] }),
      signal: opts.signal
    });
  } catch (err) {
    if (err && err.name === "AbortError") { const e = new Error("cancelled"); e.code = "cancelled"; throw e; }
    throw err;
  }
  if (res.status === 429) { const e = new Error("rate limited"); e.code = "rate_limited"; throw e; }
  if (res.status === 401 || res.status === 403) { const e = new Error("unauthorized"); e.code = "not_granted"; throw e; }
  if (!res.ok) throw new Error("http " + res.status);
  const data = await res.json();
  const text = (Array.isArray(data.content) ? data.content : []).map(b => b.text || "").join("");
  if (typeof opts.onText === "function") opts.onText({ text });
  return text;
}
function makeDirectSample() {
  if (!getApiKey()) return null;
  const fn = async (prompt, opts = {}) => ({ text: await anthropicComplete(prompt, opts) });
  fn.json = async (prompt, opts = {}) => {
    const text = await anthropicComplete(prompt, opts);
    try { return JSON.parse(stripFences(text)); }
    catch { const e = new Error("invalid json"); e.code = "invalid_json"; throw e; }
  };
  return fn;
}

  run.steps = ["done", "done", "run"]; run.secs = 0; run.chars = 0; renderSteps(run);
  run.ctl = new AbortController();

function readLabDocs() {
  const split = t => t.split("\n").map(s => s.trim()).filter(Boolean);
  return { D1: split($("#labD1").value), D2: split($("#labD2").value) };
}
function labMutate() {
  const pool = MUTATIONS.slice(); const picked = []; const used = new Set();
  while (picked.length < 2 && pool.length) { const m = pool.splice(Math.floor(Math.random() * pool.length), 1)[0]; if (!used.has(m.slot)) { picked.push(m); used.add(m.slot); } }
  const neutral = []; const n = NEUTRAL[Math.floor(Math.random() * NEUTRAL.length)];
  if (Math.random() < 0.7 && !used.has(n.slot)) neutral.push(n);
  const d = clone(LAB_CLEAN); for (const m of picked.concat(neutral)) m.apply(d);
  Object.assign(state.lab, { docs: d, applied: picked, neutral, edited: false, result: null });
  renderLab();
}
async function labRun() {
  const L = state.lab; if (L.running) return;
  const docs = readLabDocs();
  if (!docs.D1.length && !docs.D2.length) { $("#labNote").outerHTML = `<p class="err" id="labNote" style="margin:12px 0 0">أدخل نصًا في إحدى الوثيقتين على الأقل.</p>`; return; }
  if (JSON.stringify(docs) !== JSON.stringify(L.docs)) { L.edited = true; L.docs = docs; }
  L.running = true; L.result = null; renderLab();
  const run = { boxId: "labProgress", steps: [] };
  state.labRun = run;
  let raw = null;
  if (state.sample) raw = await runAI(run, LAB_VENDOR, docs, false);
  else { run.steps = ["done", "done", "skip", "skip", "done"]; run.error = "الذكاء الاصطناعي غير متاح في هذا العرض، فالتحليل من محرك القواعد فقط."; }
  const analysis = analyze(LAB_VENDOR, docs, raw, Date.now());
  L.running = false; state.labRun = null;
  L.result = { analysis, truth: (L.applied.length && !L.edited) ? grade(analysis, L.applied, L.neutral) : null };
  renderLab(); renderSteps(run);
}
function grade(a, applied, neutral) {
  const expected = []; for (const m of applied) for (const code of Object.keys(m.expect)) expected.push({ code, label: m.label });
  const aiAvailable = !!a.ai;
  const items = expected.map(e => ({ ...e, rules: a.rules.results[e.code] && a.rules.results[e.code].status !== "met", ai: aiAvailable && a.ai.results[e.code] && a.ai.results[e.code].status !== "met" }));
  const expCodes = new Set(expected.map(e => e.code));
  const falseList = Object.keys(a.final).filter(c => !expCodes.has(c) && a.final[c].status !== "met");
  return { expected, items: items.concat(neutral.map(n => ({ label: n.label }))), rulesHit: items.filter(i => i.rules).length, aiHit: items.filter(i => i.ai).length, aiAvailable, falseAlarms: falseList.length, falseList };
}

  pill.title = "اضغط لإضافة أو تغيير مفتاح تفعيل الذكاء الاصطناعي لهذه الصفحة";
  pill.addEventListener("click", async () => {
    if (window.claude && window.claude.use) return; // AI is already managed automatically by the hosting environment, nothing to configure
    const current = getApiKey();
    const val = prompt(current
      ? "مفتاح تفعيل الذكاء الاصطناعي محفوظ حاليًا في هذا المتصفح فقط.\nالصقه هنا لتغييره، أو امسحه واضغط موافق لإزالته:"
      : "الصق مفتاح تفعيل الذكاء الاصطناعي لتفعيل تحليل الذكاء الاصطناعي في هذه الصفحة (راجع دليل الإعداد للحصول عليه).\nيُحفظ فقط في هذا المتصفح ولا يُرسل لأي مكان سوى مزوّد الخدمة:", current || "");
    if (val === null) return;
    setApiKey(val.trim());
    await initAI();
  });
})();
initAI();
</script>
</body>
</html>
